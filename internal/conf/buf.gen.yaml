version: v2
managed:
  enabled: true
  override:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
      value: buf.build/go/protovalidate

plugins:
  # Generate config Go protobuf types from proto/conf into internal/conf.
  - local: protoc-gen-go
    out: internal
    opt: paths=source_relative

inputs:
  - directory: .
    paths:
      - proto/conf
