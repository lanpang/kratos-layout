server:
  http:
    addr: 0.0.0.0:8000
    timeout: 1.5s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 1.5s
data:
  database:
    driver: postgres
    source: host=127.0.0.1 user=postgres password=postgres dbname=test port=5432 sslmode=disable TimeZone=Asia/Shanghai
  redis:
    addr: 127.0.0.1:6379
    read_timeout: 0.2s
    write_timeout: 0.2s
log:
    log_path: "./logs/server.log"
    #Debug = 0;Info = 1;Warn = 2;Error = 3;Fatal = 4;
    log_level: 1
    log_rotate_size: 104857600
    keep_log_days: 30
    max_log_file: 10
    compress: true
